# Railway config for Riff Worker
# Build context = repo root, Dockerfile path = worker/Dockerfile
# (Dockerfile uses repo-root paths like `COPY worker/app ./app`)

[build]
builder = "DOCKERFILE"
dockerfilePath = "worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
