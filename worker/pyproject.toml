[project]
name = "riff-worker"
version = "0.1.0"
description = "FastAPI worker for Riff (by Outlier Agency): YouTube ingestion, transcript fetching, and Claude-powered recreate pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "google-api-python-client>=2.150.0",
    "youtube-transcript-api>=0.6.2",
    "supabase>=2.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "playwright>=1.45.0",
    "jinja2>=3.1.4",
    "pillow>=10.0.0",
    "notion-client>=2.2.0",
    "json-repair>=0.59.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
